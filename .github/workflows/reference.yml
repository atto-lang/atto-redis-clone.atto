name: Rust reference and Atto audit gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-reference-only:
    name: Rust reference tests; Atto guest NOT_EXECUTED
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Report Rust formatting drift (nonblocking)
        continue-on-error: true
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Execute Rust correctness tests from unmodified checkout
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --offline -- --nocapture
      - name: Lint Rust from unmodified checkout
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --offline -- -D warnings
      - name: Compile Rust RESP benchmark
        run: cargo build --manifest-path rust/Cargo.toml --release --bin bench_resp --offline
      - name: Measure Rust RESP2 reference throughput on this runner (Atto NOT_EXECUTED)
        shell: bash
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --offline --bin atto-redis --bin bench_resp
          DATA_DIR="$(mktemp -d)"
          ./rust/target/release/atto-redis --data-dir "$DATA_DIR" --host 127.0.0.1 --port 16379 --shards 8 --spill-mib 8 --fsync always --checkpoint-seconds 60 > /tmp/atto-redis-rust.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; rm -rf "$DATA_DIR"' EXIT
          sleep 2
          ./rust/target/release/bench_resp --rust 127.0.0.1:16379 --requests 10000

  java-transport-contract:
    name: JDK21 RESP2 bridge protocol tests (mock backend, Atto NOT_EXECUTED)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile actual RESP2 bridge and source-free contract tests
        run: |
          mkdir -p build/transport
          javac --release 21 -Xlint:all -d build/transport bridge/AttoRedisRespBridge.java bridge/AttoRedisRespBridgeContractTest.java
      - name: Execute bridge protocol, binary, limit, and fail-closed regression tests
        run: java -cp build/transport AttoRedisRespBridgeContractTest
      - name: Compile and test standalone Java in-memory RESP2 reference
        run: |
          mkdir -p build/java-reference
          javac --release 21 -d build/java-reference bridge/AttoRedisAsyncNioServer.java reference/java/RedisJavaReference.java reference/java/RedisJavaReferenceTest.java
          java -cp build/java-reference RedisJavaReferenceTest
          echo "JAVA_REFERENCE_SCOPE=VOLATILE_IN_MEMORY_ONLY"
          echo "ATTO_GUEST_EXECUTED=false"
